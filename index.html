<!DOCTYPE html>
<html>
<head>
  <title>AI Buddy</title>
</head>
<body>
  <h1>Welcome to AI Buddy</h1>
  <p>Smart AI Assam</p>
<div style="margin-top:20px;text-align:center;">
  <h2>🤖 AI Buddy</h2>
  <input id="userInput" placeholder="Message likha..." style="padding:10px;width:80%;">
  <button onclick="reply()" style="padding:10px;">Send</button>
  <p id="reply"></p>
</div>

<script>
function reply(){
  let msg = document.getElementById("userInput").value.toLowerCase();
  let answer = "";

  if(msg.includes("hello") || msg.includes("hi")){
    answer = "Hello! Moi AI Buddy 🤖😊";
  }
  else if(msg.includes("naam") || msg.includes("name")){
    answer = "Mur naam AI Buddy 🤖";
  }
  else if(msg.includes("ki kori asa")){
    answer = "Moi tumar logot kotha pati asu 😊";
  }
  else if(msg.includes("assam")){
    answer = "Assam bohut dhunia jagah ❤️";
  }
  else{
    answer = "Bujisu 😊 Aaru kua, moi help korim.";
  }

  document.getElementById("reply").innerHTML = answer;
}
</script>
</body>
</html>
