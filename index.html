<!DOCTYPE html>
<html>
<head>
  <title>AI Buddy</title>
</head>
<body>
  <h1>Welcome to AI Buddy</h1>
  <p>Smart AI Assam</p>
<div style="margin-top:20px;text-align:center;">
  <h2>🤖 AI Buddy</h2>
  <input id="userInput" placeholder="Message likha..." style="padding:10px;width:80%;">
  <button onclick="reply()" style="padding:10px;">Send</button>
  <p id="reply"></p>
</div>


<script>
function reply(){
  let msg = document.getElementById("userInput").value.toLowerCase();
  let answer = "";

  if(msg.includes("hi") || msg.includes("hello") || msg.includes("hlw")){
    answer = "Hello! Moi AI Buddy 🤖😊 Tumi keneka asa?";
  }
  else if(msg.includes("keneka asa") || msg.includes("khabar")){
    answer = "Moi bhal asu 😊 Tumar khobor kua.";
  }
  else if(msg.includes("naam") || msg.includes("name")){
    answer = "Mur naam AI Buddy 🤖";
  }
  else if(msg.includes("tumi kun")){
    answer = "Moi AI Buddy, tumar logot kotha patiboloi bonua hoise 😊";
  }
  else if(msg.includes("help")){
    answer = "Hoi, moi help koribo parim. Kua ki janibo bisara 😊";
  }
  else if(msg.includes("assam")){
    answer = "Assam bohut dhunia jagah ❤️";
  }
  else if(msg.includes("dhonyobad") || msg.includes("thanks")){
    answer = "Welcome 😊 Aaru kiba janibo bisarile kua.";
  }
  else{
    answer = "Bujisu 😊 Aaru olop bistar koi kua, moi help korim.";
  }

  document.getElementById("reply").innerHTML = answer;
}
</script>
</body>
</html>
